<!DOCTYPE html>
<html lang="pt-BR"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Plataforma de Flashcards</h1>


  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('studyTab', this)">Estudar</button>
    <button class="tab-btn" onclick="switchTab('manageTab', this)">Gerenciar / Editar</button>
  </div>

  <div class="main-container">

  
    <div id="studyTab" class="tab-content active">
      <div class="flashcard-container" onclick="flipCard()">
        <div class="card" id="card">
          <div class="card-face card-front">
            <div class="tag">Pergunta</div>
            <div class="content" id="question">Carregando...</div>
          </div>
          <div class="card-face card-back">
            <div class="tag">Resposta</div>
            <div class="content" id="answer">Carregando...</div>
          </div>
        </div>
      </div>

    
      <div class="keyboard-hints">
        <span><kbd>⎵</kbd> Embaralhar</span>
        <span><kbd>↑</kbd> <kbd>↓</kbd>Virar Card</span>
        <span><kbd>←</kbd> Anterior</span>
        <span><kbd>→</kbd> Próximo</span>
      </div>

  
      <div class="controls">
        <button onclick="prevCard()">Anterior</button>
        <span class="counter" id="counter">0 / 0</span>
        <button onclick="nextCard()">Próximo</button>
        <button class="btn-secondary" onclick="shuffleCards()">Embaralhar</button>
      </div>
    </div>

   
    <div id="manageTab" class="tab-content">
   
      <div class="form-card">
        <h2 id="formTitle">Criar Novo Flashcard</h2>
        <form id="cardForm" onsubmit="handleFormSubmit(event)">
          <div class="form-group">
            <label for="questionInput">Pergunta:</label>
            <textarea id="questionInput" placeholder="Digite a pergunta..." required></textarea>
          </div>
          <div class="form-group">
            <label for="answerInput">Resposta:</label>
            <textarea id="answerInput" placeholder="Digite a resposta..." required></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-success" id="btnSubmitForm">Salvar Flashcard</button>
            <button type="button" class="btn-secondary" id="btnCancelEdit" style="display: none;" onclick="cancelEdit()">Cancelar Edição</button>
          </div>
        </form>
      </div>

     
      <h2>Seus Flashcards Cadastrados</h2>
      <div class="card-list" id="cardList">
      
      </div>
    </div>

  </div>

  <script>
    const defaultFlashcards = [
      {
        id: 1,
        pergunta: "Teste 1",
        resposta: "Resposta teste 1"
      },
      {
        id: 2,
        pergunta: "Teste 2",
        resposta: "Resposta 2"
      },
      {
        id: 3,
        pergunta: "Teste 3",
        resposta: "Resposta 3"
      }
    ];

  
    let flashcards = JSON.parse(localStorage.getItem('flashcards_data_v2')) || defaultFlashcards;
    let currentIndex = 0;
    let editingCardId = null;

    // Elementos DOM
    const cardElement = document.getElementById('card');
    const questionElement = document.getElementById('question');
    const answerElement = document.getElementById('answer');
    const counterElement = document.getElementById('counter');

    const formTitle = document.getElementById('formTitle');
    const questionInput = document.getElementById('questionInput');
    const answerInput = document.getElementById('answerInput');
    const btnSubmitForm = document.getElementById('btnSubmitForm');
    const btnCancelEdit = document.getElementById('btnCancelEdit');
    const cardListElement = document.getElementById('cardList');

  
    function saveToStorage() {
      localStorage.setItem('flashcards_data_v2', JSON.stringify(flashcards));
    }

    // Alternar entre as Abas
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');

      if (tabId === 'studyTab') {
        loadCard();
      } else {
        renderManageList();
      }
    }

   
    function loadCard() {
      cardElement.classList.remove('flipped');

      if (flashcards.length === 0) {
        setTimeout(() => {
          questionElement.innerHTML = '<div class="empty-state">Sem cartões.<br>Adicione na aba Gerenciar!</div>';
          answerElement.innerHTML = '<div class="empty-state">Sem cartões.<br>Adicione na aba Gerenciar!</div>';
          counterElement.textContent = '0 / 0';
        }, 150);
        return;
      }

      if (currentIndex >= flashcards.length) currentIndex = flashcards.length - 1;
      if (currentIndex < 0) currentIndex = 0;

      setTimeout(() => {
        questionElement.textContent = flashcards[currentIndex].pergunta;
        answerElement.textContent = flashcards[currentIndex].resposta;
        counterElement.textContent = `${currentIndex + 1} / ${flashcards.length}`;
      }, 150);
    }

    function flipCard() {
      if (flashcards.length > 0) {
        cardElement.classList.toggle('flipped');
      }
    }

    function nextCard() {
      if (flashcards.length === 0) return;
      currentIndex = (currentIndex + 1) % flashcards.length;
      loadCard();
    }

    function prevCard() {
      if (flashcards.length === 0) return;
      currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
      loadCard();
    }

    function shuffleCards() {
      if (flashcards.length <= 1) return;
      for (let i = flashcards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
      }
      currentIndex = 0;
      saveToStorage();
      loadCard();
    }

    
    document.addEventListener('keydown', (e) => {
    
      if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') {
        return;
      }

 if (document.getElementById('studyTab').classList.contains('active')) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        flipCard();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextCard();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevCard();
      } else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        shuffleCards();
      }
    }
  });

    
    function handleFormSubmit(event) {
      event.preventDefault();

      const pergunta = questionInput.value.trim();
      const resposta = answerInput.value.trim();

      if (!pergunta || !resposta) return;

      if (editingCardId !== null) {
        const cardIndex = flashcards.findIndex(card => card.id === editingCardId);
        if (cardIndex !== -1) {
          flashcards[cardIndex].pergunta = pergunta;
          flashcards[cardIndex].resposta = resposta;
        }
        cancelEdit();
      } else {
        const newCard = {
          id: Date.now(),
          pergunta,
          resposta
        };
        flashcards.push(newCard);
      }

      saveToStorage(); 
      resetForm();
      renderManageList();
    }

    function editCard(id) {
      const cardToEdit = flashcards.find(card => card.id === id);
      if (!cardToEdit) return;

      editingCardId = cardToEdit.id;
      questionInput.value = cardToEdit.pergunta;
      answerInput.value = cardToEdit.resposta;

      formTitle.textContent = "Editar Flashcard";
      btnSubmitForm.textContent = "Atualizar Flashcard";
      btnCancelEdit.style.display = "inline-flex";

      window.scrollTo({ top: 0, behavior: 'smooth' });
      questionInput.focus();
    }

    function cancelEdit() {
      editingCardId = null;
      formTitle.textContent = "Criar Novo Flashcard";
      btnSubmitForm.textContent = "Salvar Flashcard";
      btnCancelEdit.style.display = "none";
      resetForm();
    }

    function resetForm() {
      questionInput.value = '';
      answerInput.value = '';
    }

    function deleteCard(id) {
      if (confirm("Tem certeza que deseja excluir este flashcard?")) {
        flashcards = flashcards.filter(card => card.id !== id);
        saveToStorage(); // Atualiza a gravação permanente no LocalStorage
        renderManageList();

        if (editingCardId === id) {
          cancelEdit();
        }
      }
    }

    
    function renderManageList() {
      cardListElement.innerHTML = '';

      if (flashcards.length === 0) {
        cardListElement.innerHTML = '<p style="color: #64748b; text-align: center;">Nenhum flashcard cadastrado.</p>';
        return;
      }

      flashcards.forEach((card, index) => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="list-item-text">
            <span class="list-item-q">${index + 1}. ${escapeHtml(card.pergunta)}</span>
            <span class="list-item-a">${escapeHtml(card.resposta)}</span>
          </div>
          <div class="list-item-actions">
            <button class="btn-edit" onclick="editCard(${card.id})">Editar</button>
            <button class="btn-danger" onclick="deleteCard(${card.id})">Excluir</button>
          </div>
        `;
        cardListElement.appendChild(item);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Inicialização
    loadCard();
  </script>

</body>
</html>
